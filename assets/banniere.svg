<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="UKR — génie électrique et agents IA">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f4d"/>
      <stop offset="0.55" stop-color="#123a8f"/>
      <stop offset="1" stop-color="#1d5fe0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.82" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#7fb0ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7fb0ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="points" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.12"/>
    </pattern>
    <clipPath id="cadre"><rect width="1200" height="320" rx="24"/></clipPath>
    <style>
      .titre { font: 700 54px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; letter-spacing: -1px; }
      .sous { font: 400 24px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #cfe0ff; }
      .puce { font: 600 17px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; }
      .onde { fill: none; stroke-width: 2.4; stroke-linecap: round; }
      .defile { animation: defile 9s linear infinite; }
      @keyframes defile { to { transform: translateX(-300px); } }
      @media (prefers-reduced-motion: reduce) { .defile { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#cadre)">
    <rect width="1200" height="320" fill="url(#fond)"/>
    <rect width="1200" height="320" fill="url(#points)"/>
    <rect width="1200" height="320" fill="url(#halo)"/>

    <!-- Les trois phases du réseau, décalées de 120° : le génie électrique en fond. -->
    <g transform="translate(0 262)" opacity="0.55">
      <g class="defile">
        <path class="onde" stroke="#9cc2ff" d="M0 0 C 25 -36 75 -36 100 0 S 175 36 200 0 S 275 -36 300 0 S 375 36 400 0 S 475 -36 500 0 S 575 36 600 0 S 675 -36 700 0 S 775 36 800 0 S 875 -36 900 0 S 975 36 1000 0 S 1075 -36 1100 0 S 1175 36 1200 0 S 1275 -36 1300 0 S 1375 36 1400 0 S 1475 -36 1500 0"/>
        <path class="onde" stroke="#5f9bff" transform="translate(-67 0)" d="M0 0 C 25 -36 75 -36 100 0 S 175 36 200 0 S 275 -36 300 0 S 375 36 400 0 S 475 -36 500 0 S 575 36 600 0 S 675 -36 700 0 S 775 36 800 0 S 875 -36 900 0 S 975 36 1000 0 S 1075 -36 1100 0 S 1175 36 1200 0 S 1275 -36 1300 0 S 1375 36 1400 0 S 1475 -36 1500 0 S 1575 36 1600 0"/>
        <path class="onde" stroke="#ffffff" stroke-opacity="0.7" transform="translate(-133 0)" d="M0 0 C 25 -36 75 -36 100 0 S 175 36 200 0 S 275 -36 300 0 S 375 36 400 0 S 475 -36 500 0 S 575 36 600 0 S 675 -36 700 0 S 775 36 800 0 S 875 -36 900 0 S 975 36 1000 0 S 1075 -36 1100 0 S 1175 36 1200 0 S 1275 -36 1300 0 S 1375 36 1400 0 S 1475 -36 1500 0 S 1575 36 1600 0"/>
      </g>
    </g>

    <!-- Logo dans une tuile blanche, comme sur le portfolio. -->
    <rect x="64" y="58" width="112" height="112" rx="30" fill="#ffffff"/>
    <image x="88" y="78" width="64" height="73" href="data:image/png;base64,"/>

    <text x="204" y="112" class="titre">Génie électrique × agents IA</text>
    <text x="206" y="152" class="sous">Étudiant en 2e année de BUT GEII · sites et automatisations avec RGM Dev</text>

    <g transform="translate(206 180)">
      <rect width="330" height="38" rx="19" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.35"/>
      <circle cx="22" cy="19" r="5" fill="#8fd8ff"/>
      <text x="38" y="25" class="puce">Stage recherché · avril – mai 2027</text>
    </g>
  </g>
</svg>
